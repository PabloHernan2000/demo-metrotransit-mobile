services:
  mock-api:
    build:
      context: ./mock-server
      dockerfile: Dockerfile
    container_name: metrotransit-mock-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
